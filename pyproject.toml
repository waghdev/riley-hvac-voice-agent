[project]
name = "voice-agent-reference"
version = "0.1.0"
description = "Riley: a production-style AI phone agent on LiveKit Agents for a fictional HVAC company"
readme = "README.md"
# One minor version, matching local dev and CI. LiveKit Agents supports >=3.10,<3.15.
requires-python = ">=3.13,<3.14"
dependencies = [
    # CRM delivery (crm_client.py). Already installed via google-genai; pinned because we use it.
    "httpx==0.28.1",
    # No silero extra: AgentSession bundles Silero VAD (inference.VAD) when none is passed.
    "livekit-agents[deepgram,google]==1.8.8",
    "livekit-plugins-ai-coustics==0.3.5",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    # Time zones for the booking calendar: Windows and slim images have no system tz database.
    "tzdata==2026.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    {include-group = "mock"},  # the mock CRM's tests need FastAPI
]
# The mock CRM (mock_crm/app.py). Not in the agent image: the Dockerfile syncs with --no-dev.
mock = [
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import name is `agent` (src/agent/), not the distribution name.
module-name = "agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]  # so tests can import scripts/*.py and mock_crm
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: calls a real LLM and spends free-tier quota; run locally, not in CI",
]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "."]  # first-party import roots, for import sorting

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
